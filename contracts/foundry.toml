[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["lib"]
fs_permissions = [{ access = "read", path = "out" }, { access = "read", path = "../packages/circuit-sdk/fixtures/policies-v1.json" }]
solc_version = "0.8.26"
evm_version = "paris"
via_ir = true
optimizer = true
optimizer_runs = 200
remappings = ["@openzeppelin/contracts/=lib/openzeppelin/"]
# Historical import retained for provenance. Build the P0 transitive dependency graph.
skip = ["src/core/**"]

[profile.release]
optimizer_runs = 200
